apiVersion: v1
kind: PersistentVolume
metadata:
  name: hami-lc-users-nfs
spec:
  capacity:
    storage: 200Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4
  nfs:
    server: nas-server
    path: ${NAS_HOME_EXPORT}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hami-lc-user-home
  namespace: jupyterhub
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: 200Gi
