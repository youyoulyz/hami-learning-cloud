apiVersion: v1
kind: PersistentVolume
metadata:
  name: hami-lc-home-nfs
  labels:
    type: nfs
spec:
  capacity:
    storage: 200Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - nfsvers=4.2
    - hard
    - timeo=600
  nfs:
    # Local values come from .env.local (rendered by scripts/render_local.sh
    # into build/nfs-home.yaml); do not commit real values.
    server: ${NAS_SERVER}
    path: ${NAS_HOME_EXPORT}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hami-lc-home
  namespace: default
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 200Gi
  volumeName: hami-lc-home-nfs
  storageClassName: ""

