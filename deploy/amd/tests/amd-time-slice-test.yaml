apiVersion: v1
kind: Pod
metadata:
  name: amd-time-slice-test-1
  labels:
    app: amd-time-slice-test
spec:
  nodeSelector:
    # Rendered from AMD_GPU_NODE_HOSTNAME in .env.local (scripts/render_local.sh);
    # do not commit node names.
    kubernetes.io/hostname: ${AMD_GPU_NODE_HOSTNAME}
  hostIPC: true
  restartPolicy: Never
  containers:
    - name: torch
      image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/rocm/pytorch:rocm7.2.4_ubuntu24.04_py3.12_pytorch_release_2.10.0
      imagePullPolicy: IfNotPresent
      env:
        - name: HSA_ENABLE_SDMA
          value: "0"
        - name: HIP_VISIBLE_DEVICES
          value: "0"
      command:
        - /bin/bash
        - -lc
        - |
          python - <<'PY'
          import torch
          print("torch", torch.__version__)
          print("cuda_available", torch.cuda.is_available())
          assert torch.cuda.is_available(), "torch.cuda.is_available() is False"
          print("device", torch.cuda.get_device_name(0))
          x = torch.randn(1024, 1024, device="cuda")
          y = x @ x
          print("matmul_sum", y.sum().item())
          print("AMD_TIME_SLICE_OK")
          PY
      securityContext:
        privileged: true
      resources:
        limits:
          amd.com/gpu: "1"
---
