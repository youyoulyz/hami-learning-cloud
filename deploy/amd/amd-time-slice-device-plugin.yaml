apiVersion: v1
kind: Namespace
metadata:
  name: amd-gpu
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: amdgpu-device-plugin-config
  namespace: amd-gpu
data:
  config.yaml: |
    version: "1.0"
    sharing:
      timeSlicing:
        enabled: true
        sliceCount: 3
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: amdgpu-device-plugin
  namespace: amd-gpu
  labels:
    app.kubernetes.io/name: amdgpu-device-plugin
    app.kubernetes.io/component: device-plugin
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: amdgpu-device-plugin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: amdgpu-device-plugin
    spec:
      priorityClassName: system-node-critical
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
        - effect: NoSchedule
          operator: Exists
        - effect: NoExecute
          operator: Exists
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: amd.com/gpu.present
                    operator: In
                    values:
                      - "true"
      volumes:
        - name: dev-kfd
          hostPath:
            path: /dev/kfd
        - name: dev-dri
          hostPath:
            path: /dev/dri
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
            type: Directory
        - name: sys-amdgpu
          hostPath:
            path: /sys/class/drm
            type: Directory
        - name: sys-kfd
          hostPath:
            path: /sys/class/kfd
            type: Directory
        - name: config
          configMap:
            name: amdgpu-device-plugin-config
        - name: time-slice-binary
          hostPath:
            path: /opt/hami-lc/amd-time-slice
            type: Directory
      containers:
        - name: amdgpu-dp
          image: docker.io/rocm/k8s-device-plugin:latest
          imagePullPolicy: IfNotPresent
          command:
            - /opt/amd-time-slice/k8s-device-plugin
          env:
            - name: CONFIG_FILE_PATH
              value: /etc/amdgpu-dp/config.yaml
            - name: AMD_TIME_SLICE_COUNT
              value: "3"
          securityContext:
            privileged: true
          volumeMounts:
            - name: dev-kfd
              mountPath: /dev/kfd
            - name: dev-dri
              mountPath: /dev/dri
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            - name: sys-amdgpu
              mountPath: /sys/class/drm
              readOnly: true
            - name: sys-kfd
              mountPath: /sys/class/kfd
              readOnly: true
            - name: config
              mountPath: /etc/amdgpu-dp
              readOnly: true
            - name: time-slice-binary
              mountPath: /opt/amd-time-slice
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
