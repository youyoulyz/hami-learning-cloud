apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://hami-webui-kube-prometheus-prometheus.kube-system.svc:9090
        isDefault: true
        uid: prometheus
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
data:
  provider.yaml: |
    apiVersion: 1
    folders: []
    name: default
    updated: 2026-08-19T00:00:00Z
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
    allowUiUpdates: true
    plugins: []
  hami-gpu.json: |
    {
      "title": "hami-learning-cloud GPU",
      "uid": "hami-gpu",
      "schemaVersion": 38,
      "refresh": "5s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Per-user VRAM used (HAMi)",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "targets": [
            {
              "datasource": { "uid": "prometheus" },
              "expr": "sum by (namespace_name, pod_name) (hami_container_memory_used)",
              "legendFormat": "{{pod_name}}"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Per-user compute used (HAMi)",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 8 },
          "fieldConfig": { "defaults": { "unit": "percent" }, "overrides": [] },
          "targets": [
            {
              "datasource": { "uid": "prometheus" },
              "expr": "sum by (namespace_name, pod_name) (hami_container_core_used)",
              "legendFormat": "{{pod_name}}"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "NV GPU utilization (DCGM)",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 16 },
          "fieldConfig": { "defaults": { "unit": "percent" }, "overrides": [] },
          "targets": [
            {
              "datasource": { "uid": "prometheus" },
              "expr": "avg by (modelName, gpu) (DCGM_FI_DEV_GPU_UTIL)",
              "legendFormat": "{{modelName}} gpu{{gpu}}"
            }
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/grafana/grafana:11.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /var/lib/grafana/dashboards/hami-gpu.json
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards
          configMap:
            name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30300
