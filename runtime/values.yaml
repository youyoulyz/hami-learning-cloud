# hami-learning-cloud - Deployment Configuration
#
# Deploy with:
#   helm install jupyterhub ./chart -n jupyterhub --create-namespace -f values.yaml
#
# This file contains environment-specific overrides.
# See chart/values.yaml for all available options and defaults.
#
# ============================================================================
# Course Management Guide
# ============================================================================
# Add a new course:
#   1. Add course image in custom.resources.images
#   2. Add resource requirements in custom.resources.requirements
#   3. Add team access permissions in custom.teams.mapping
#
# Modify a course:
#   - Change image address or tag in images
#   - Adjust CPU/memory/GPU settings in requirements
#
# Add a new accelerator:
#   - Add a new accelerator entry in custom.accelerators
# ============================================================================

custom:
  # Authentication mode
  # - auto-login: No credentials required, auto-login as 'student' (for single-node dev)
  # - dummy: Accept any username/password (for testing)
  # - github: GitHub App authentication
  # - multi: GitHub App + Local accounts
  authMode: "dummy"

  # GitHub organization name for team-based resource access
  # Required for github and multi auth modes.
  # githubOrgName: "<YOUR-ORG-NAME>"

  # Cluster display name (optional). Appended to "hami-learning-cloud" in the UI.
  # Example: "City/University" → "hami-learning-cloud City/University"
  clusterName: ""

  # Auto-create admin user on first install
  adminUser:
    enabled: false

  # ============================================================================
  # Notifications
  # ============================================================================
  # Helm value changes require `helm upgrade` and a Hub restart or rollout before
  # users see updated notices.
  # Notice id and version identify configured notices only; they do not control
  # backend dismissal state. Collapsed or expanded topbar state is client-only
  # and is not persisted.
  # Markdown and HTML are sanitized by the Hub backend before rendering. Only a
  # small backend allowlist of tags, attributes, and URL schemes is rendered.
  notifications:
    enabled: true
    topbar:
      # Disabled by default so the standard install renders no urgent topbar notice.
      # Set enabled=true and fill id/title/message to show a stateless, collapsible banner.
      enabled: false
      id: ""
      version: "1"
      severity: warning
      dismissible: true
      title: ""
      message: ""
      format: markdown
      link:
        label: ""
        url: ""
      # Optional ISO-8601 strings; invalid time windows are handled by backend validation.
      startsAt: ""
      endsAt: ""
    homepage:
      enabled: true
      # When no structured homepage items are active, fall back to the legacy
      # hub.extraFiles.announcement.txt content mounted as static/announcement.txt.
      legacyAnnouncementFallback: true
      items:
        - id: platform-welcome
          version: "1"
          severity: info
          eyebrow: "Platform"
          title: "Welcome to hami-learning-cloud"
          message: "Launch GPU notebooks with NVIDIA HAMi vGPU or AMD ROCm time slicing."
          format: markdown
          startsAt: ""
          endsAt: ""
          link:
            label: ""
            url: ""
  # ============================================================================
  # Allowed Origins
  # ============================================================================
  # hub.allowedOrigins      — sets Access-Control-Allow-Origin on Hub HTTP responses
  # notebook.allowedOrigins — injected into each notebook server's startup args
  #                           (--ServerApp.allow_origin_pat); handles kernel WebSocket
  #
  # Use ["*"] to allow all, or list specific domains.
  # Example: ["https://mylab.example.com", "https://alt.example.org"]
  hub:
    allowedOrigins: ["*"]
  notebook:
    allowedOrigins: ["*"]

  # ============================================================================
  # Code Server
  # ============================================================================
  # code-server automatically trusts the current public Hub host for outgoing
  # Back-to-Hub links. Add extra domains only when a deployment intentionally
  # opens trusted links to additional sites. Use host/domain entries, not URLs.
  codeServer:
    extraTrustedDomains: []

  # ============================================================================
  # Public Scheme (TLS termination outside the chart)
  # ============================================================================
  # When TLS is terminated by an external component (Cloudflare tunnel,
  # external ingress / HTTPS load balancer) instead of the chart's autohttps
  # (proxy.https.enabled=true), set publicScheme="https" so the Hub marks the
  # _xsrf cookie Secure. Leave unset (or "http") for the default single-node
  # HTTP install — browsers reject Secure cookies received over HTTP and
  # POST /hub/spawn would 403 (see AUPPM-64).
  # security:
  #   publicScheme: "https"

  # ============================================================================
  # Git Repository Cloning
  # ============================================================================
  # Users can provide an optional Git URL on the spawn form. The repo is cloned
  # into ~/home at container start via an init container.
  #
  # Private repo access, two independent mechanisms that can be used together:
  #
  #   1. GitHub App (githubAppName)
  #      For GitHub App users. Users authorize per-repo read-only access via
  #      the GitHub App UI. Token is obtained automatically from OAuth session.
  #      Requires migrating from OAuth App to GitHub App. See below.
  #
  #   2. Default Access Token (defaultAccessToken)
  #      A bot/service-account PAT configured by the admin. Applied transparently
  #      to all users (including auto-login). Useful for single-node / classroom
  #      setups where everyone needs access to the same private repos without
  #      any GitHub login.
  #
  # Token priority: OAuth token (GitHub App) > defaultAccessToken > none (public only)
  #
  # Migrating from OAuth App to GitHub App:
  #   1. Create a GitHub App (org settings → Developer settings → GitHub Apps)
  #      - Callback URL: same as current oauth_callback_url
  #      - Permissions: Contents (read-only), Metadata (read-only), Members (read-only)
  #      - Webhook: off
  #   2. Update hub.config.GitHubOAuthenticator:
  #        app_id: "<GitHub App App ID>"
  #        installation_id: "<GitHub App Installation ID>"  # Optional; leave blank to auto-discover from the org installation
  #        private_key_file: "<Mounted GitHub App private key path>"
  #        client_id: "<GitHub App Client ID>"
  #        client_secret: "<GitHub App Client Secret>"
  #        scope: []  # GitHub App does not use OAuth scopes
  #   3. Set githubAppName below to the App slug
  #   4. helm upgrade. Existing user sessions continue, new logins use GitHub App.
  #
  gitClone:
    # -- Private Repo Access --
    # GitHub App slug (e.g. "aup-learning-cloud")
    # Enables repo picker UI and automatic OAuth token usage for private repos.
    # Only effective for GitHub App users; auto-login/native users are unaffected.
    githubAppName: ""
    # Default access token for private repos (e.g. a bot/service account PAT).
    # Works for ALL auth modes including auto-login — users don't need to know
    # the token exists. Helm auto-creates a K8s Secret from this value.
    # Scope the PAT to read-only on specific repos to limit blast radius.
    defaultAccessToken: ""
    # -- Clone Behavior --
    # Allowed Git hosting providers (subdomains are also accepted)
    allowedProviders:
      - github.com
      - gitlab.com
      - bitbucket.org
    # Maximum time (seconds) allowed for a clone or fetch operation
    maxCloneTimeout: 300
    # Container image used for git operations (must include git and sh)
    initContainerImage: "alpine/git:2.47.2"
    # -- Persistence Behavior --
    # Cloned repositories are kept by default after the user's server stops.
    # Set to false to restore ephemeral cleanup as the admin-enforced default.
    #
    # Behavior table:
    #   defaultPersistence | allowPersistenceChoice | Result
    #   true               | false                  | Repos are kept after stop.
    #   false              | false                  | Repos are cleaned when the server stops.
    #   true or false      | true                   | Users choose on the spawn form. The default checkbox state follows defaultPersistence.
    #   any                | any                    | Existing unmanaged same-name directories are preserved and not overwritten.
    #
    # Persistent mode reuses an existing compatible clone. It does not auto-pull,
    # reset, or sync repository contents after the first successful clone.
    defaultPersistence: true
    # Allow users to choose whether cloned repositories persist in the spawn form.
    # When false, the admin default is enforced without exposing a user toggle.
    allowPersistenceChoice: false

  # ============================================================================
  # Accelerator Configuration
  # ============================================================================
  # Define available accelerator entries for the course selection interface.
  # Each accelerator uses Kubernetes node selectors such as
  # amd.com/gpu.product-name to target compatible nodes.
  accelerators:
    nvidia:
      displayName: "NVIDIA GPU (HAMi vGPU)"
      description: "Hard VRAM/compute quota via nvidia.com/gpumem + gpucores"
      nodeSelector:
        gpu-vendor: "nvidia"
      env: {}
      quotaRate: 2
    amd:
      displayName: "AMD GPU (time-slicing)"
      description: "Shared 7900XTX via amd.com/gpu time slices"
      nodeSelector:
        gpu-vendor: "amd"
      env:
        HSA_ENABLE_SDMA: "0"
      quotaRate: 2

  # ============================================================================
  # Course Resources Configuration
  # ============================================================================
  resources:
    # Course Images
    # Add new course images here
    images:
      cpu: "quay.io/jupyter/pytorch-notebook:cuda13-notebook-7.5.6"
      gpu: "quay.io/jupyter/pytorch-notebook:cuda13-notebook-7.5.6"
      code-cpu: "docker.io/library/hami-lc-code-cpu:v1"
      code-gpu: "docker.io/library/hami-lc-code-gpu:v1"

    # Optional spawn/Home group display order. Groups not listed here are shown
    # after these entries using the default alphabetical order.
    # Example: move DEVELOPMENT before COURSE by listing DEVELOPMENT first.
    groupOrder:
      - CPU
      - GPU
      - DEVELOPMENT

    # Course Resource Requirements
    # Define resource quotas for each course
    requirements:
      cpu:
        cpu: "2"
        memory: "4Gi"
        memory_limit: "6Gi"
      gpu:
        cpu: "4"
        memory: "8Gi"
        memory_limit: "8Gi"
        amd.com/gpu: "1"
      code-cpu:
        cpu: "2"
        memory: "4Gi"
        memory_limit: "6Gi"
      code-gpu:
        cpu: "4"
        memory: "8Gi"
        memory_limit: "8Gi"
        amd.com/gpu: "1"
      none:
        cpu: "0"
        memory: "0Gi"

    # Course Metadata (for spawn UI)
    # Defines display information for each course
    # defaultPath is an optional Hub launch-directory override, not the image
    # WORKDIR. Custom Repo launches always open the cloned repository first. If
    # defaultPath is omitted or null, Hub does not force a landing path and the
    # image/application default normally follows the image WORKDIR.
    metadata:
      cpu:
        group: "CPU"
        description: "CPU Notebook"
        subDescription: "PyTorch notebook without GPU"
        accelerator: ""
        acceleratorKeys: []
        allowGitClone: true
        defaultPath: "/home/jovyan"
        resourceType: "notebook"
      gpu:
        group: "GPU"
        description: "GPU Notebook"
        subDescription: "Choose NVIDIA (HAMi vGPU) or AMD (time-slicing)"
        accelerator: "GPU"
        acceleratorKeys:
          - nvidia
          - amd
        allowGitClone: true
        defaultPath: "/home/jovyan"
        resourceType: "notebook"
        acceleratorOverrides:
          amd:
            image: "docker.io/library/hami-lc-amd:v1"
            env:
              HSA_ENABLE_SDMA: "0"
              HIP_VISIBLE_DEVICES: "0"
      code-cpu:
        group: "DEVELOPMENT"
        description: "VS Code Server (CPU)"
        subDescription: "Browser-based code-server without GPU"
        accelerator: ""
        acceleratorKeys: []
        allowGitClone: true
        defaultPath: "/home/jovyan"
        resourceType: "browser-ide"
        launchMode: "code-server"
      code-gpu:
        group: "DEVELOPMENT"
        description: "VS Code Server (GPU)"
        subDescription: "Browser-based code-server with NVIDIA (HAMi vGPU); AMD variant pending"
        accelerator: "GPU"
        acceleratorKeys:
          - nvidia
        allowGitClone: true
        defaultPath: "/home/jovyan"
        resourceType: "browser-ide"
        launchMode: "code-server"

  # ============================================================================
  # Team Permission Configuration
  # ============================================================================
  # Define which teams can access which courses
  teams:
    mapping:
      cpu:
        - cpu
        - code-cpu
      gpu:
        - gpu
        - code-gpu
      official:
        - cpu
        - gpu
        - code-cpu
        - code-gpu
      native-users:
        - cpu
        - gpu
        - code-cpu
        - code-gpu
      github-users:
        - cpu
        - gpu
        - code-cpu
        - code-gpu

  # ============================================================================
  # Quota Management
  # ============================================================================
  quota:
    # Enable quota system (auto-disabled for auto-login/dummy modes if not set)
    enabled: true
    # CPU-only quota consumption rate
    cpuRate: 1
    # Minimum quota required to start any container
    minimumToStart: 10
    # Default quota for new users (0 = no initial allocation)
    defaultQuota: 100
    # Auto-refresh rules: each rule generates a K8s CronJob
    refreshRules: {}

# Use K3s built-in local-path storage (no NFS required)
hub:
  nodeSelector:
    kubernetes.io/hostname: hub-node
  db:
    pvc:
      storageClassName: local-path
  image:
    name: docker.io/library/hami-lc-hub
    tag: v1
    pullPolicy: Never

  # Optional Jinja template variables for Hub-rendered pages.
  # Example:
  #   login_github_helper_text: "Optional helper text shown under the GitHub sign-in button."
  templateVars: {}

  # Additional Python config snippets (executed after core/setup.py)
  # Example:
  #   myconfig: |
  #     c.JupyterHub.some_setting = "value"
  extraConfig: {}

  extraFiles:
    announcement.txt:
      # Replace stringData with login announcement content to show a notice on login.html.
      # The default HTML comment is intentionally hidden by the login template.
      mountPath: /usr/local/share/jupyterhub/static/announcement.txt
      stringData: |
        <!-- Add login announcement content here. -->

  config:
    # ---- Hub Core ----
    JupyterHub:
      # Always show Home page first, even when a server is already running.
      # Users can access their running server via the "My Server" button on Home.
      redirect_to_server: false

    Authenticator:
      allow_all: true
      admin_users:
        - admin

    # ---- GitHub App ----
    GitHubOAuthenticator:
      oauth_callback_url: "https://<Your.domain>/hub/github/oauth_callback"
      app_id: ""
      # Optional; leave blank when the GitHub App is installed on the org and the Hub can auto-discover it.
      installation_id: ""
      private_key_file: ""
      private_key: ""
      team_sync_ttl_seconds: 3600
      client_id: "TODO"
      client_secret: "TODO"
      allowed_organizations:
        - <YOUR-ORG-NAME>
      # Use [] for GitHub App credentials. For legacy OAuth Apps, use
      # read:user and read:org instead.
      scope: []

    # ---- KubeSpawner Prepuller Setup ----
    KubeSpawner:
      image_pull_policy: IfNotPresent

monitoring:
  enabled: false
  namespace: monitoring
  releaseLabel: monitoring

  hubMetrics:
    enabled: false
    # Keep JupyterHub's read:metrics scope requirement enabled by default.
    # Set this to true only for isolated development environments where
    # /hub/metrics is guaranteed not to be reachable through a public proxy,
    # NodePort, LoadBalancer, or Ingress.
    allowUnauthenticatedScrape: false
    serviceAnnotations:
      # Annotation-based Prometheus scraping cannot attach the JupyterHub token.
      # Prefer the ServiceMonitor below for authenticated in-cluster scraping.
      enabled: false

  serviceMonitor:
    enabled: false
    interval: 15s
    authorization:
      enabled: true
      type: Bearer
      hubServiceName: prometheus-metrics
      secret:
        create: true
        name: ""
        key: token

  grafana:
    dashboard:
      enabled: false

  prometheusRule:
    enabled: false

singleuser:
  startTimeout: 900
  cmd: jupyterhub-singleuser --allow-root
  # Security context for user pods to access GPU devices
  # supplementalGroups grants container access to host's render group (GID 993)
  # This allows non-root users to access /dev/kfd and /dev/dri devices
  extraPodConfig:
    securityContext:
      fsGroup: 100
      supplementalGroups:
        - 993 # render group for ROCm GPU access

  storage:
    type: static
    homeMountPath: /home/jovyan
    static:
      pvcName: hami-lc-user-home
      subPath: "{username}"

# Use NodePort for direct access
proxy:
  service:
    type: NodePort
    nodePorts:
      http: 30890

# Disable the AUP busy-node user scheduler; NV pods use hami-scheduler and
# AMD/CPU pods can use the default scheduler for the MVP.
scheduling:
  userScheduler:
    enabled: false

# Disable ingress (use NodePort instead)
ingress:
  enabled: false

# Disable prePuller for faster deployment
# Images will be pulled on-demand when users spawn notebooks
prePuller:
  hook:
    enabled: false
  continuous:
    enabled: false
